name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 3 */4 * *'   # a cada ~4 dias, 03:00 UTC
  workflow_dispatch:         # permite rodar manualmente para testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar ping para o Supabase
        run: |
          curl -f -sS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive_logs" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "automated_login_ping"}'